name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    name: Typecheck, lint, tests y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Formato
        run: npx prettier --check .
      - name: Tests unitarios y cobertura
        run: npm run test:coverage
      - name: Build web
        run: npm run build

  e2e:
    name: Tests end-to-end (Chromium y WebKit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Instalar navegadores de Playwright
        run: npx playwright install --with-deps chromium webkit
      - name: Tests e2e
        run: npm run test:e2e
      - name: Guardar el informe si fallan
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
