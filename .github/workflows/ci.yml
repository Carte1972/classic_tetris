name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    name: Typecheck, lint, tests y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Formato
        run: npx prettier --check .
      - name: Tests unitarios y cobertura
        run: npm run test:coverage
      - name: Build web
        run: npm run build

  e2e:
    name: Tests end-to-end (Chromium y WebKit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Instalar navegadores de Playwright
        run: npx playwright install --with-deps chromium webkit
      - name: Tests e2e
        run: npm run test:e2e
      - name: Guardar el informe si fallan
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  launchers:
    name: Lanzadores y paquete (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      BLOQUES_LAUNCHER_DRY_RUN: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Sin build, el lanzador avisa y falla (macOS y Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          launcher=launchers/bloques.sh
          if [ "$RUNNER_OS" = "macOS" ]; then launcher=launchers/Bloques.command; fi
          if "$launcher"; then echo "El lanzador debería fallar sin build"; exit 1; fi
      - name: Sin build, el lanzador avisa y falla (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          & .\launchers\Bloques.bat
          if ($LASTEXITCODE -ne 1) { throw "El lanzador debería fallar sin build" }
          $global:LASTEXITCODE = 0

      - run: npm run build
      - run: npm run package

      - name: Lanzador desde el repositorio y desde el paquete (macOS y Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          launcher=bloques.sh
          if [ "$RUNNER_OS" = "macOS" ]; then launcher=Bloques.command; fi
          out=$("launchers/$launcher")
          echo "$out"
          [[ "$out" == "$PWD/dist/index.html" ]]
          mkdir -p "$RUNNER_TEMP/paquete"
          unzip -q release/bloques-v*.zip -d "$RUNNER_TEMP/paquete"
          game_dir=$(echo "$RUNNER_TEMP"/paquete/bloques-v*)
          [ -x "$game_dir/$launcher" ]
          out=$("$game_dir/$launcher")
          echo "$out"
          [[ "$out" == "$(cd "$game_dir" && pwd)/index.html" ]]
      - name: Lanzador desde el repositorio y desde el paquete (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $out = (& .\launchers\Bloques.bat | Out-String).Trim()
          Write-Output $out
          if ($out -ne (Resolve-Path dist\index.html).Path) { throw "Ruta inesperada: $out" }
          $zip = Get-ChildItem release\bloques-v*.zip | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath "$env:RUNNER_TEMP\paquete"
          $dir = Get-ChildItem "$env:RUNNER_TEMP\paquete" -Directory | Select-Object -First 1
          $out = (& "$($dir.FullName)\Bloques.bat" | Out-String).Trim()
          Write-Output $out
          if ($out -ne (Join-Path $dir.FullName 'index.html')) { throw "Ruta inesperada: $out" }
