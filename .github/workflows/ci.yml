name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    name: Typecheck, lint, tests y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Formato
        run: npx prettier --check .
      - name: Tests unitarios y cobertura
        run: npm run test:coverage
      - name: Build web
        run: npm run build
